x-audio-environment: &audio-environment
  OUTPUT_ROOT: /outputs
  HF_HOME: /models/huggingface
  HF_HUB_CACHE: /models/huggingface/hub
  TRANSFORMERS_CACHE: /models/huggingface
  TORCH_HOME: /models/torch
  XDG_CACHE_HOME: /models/cache
  MPLCONFIGDIR: /models/cache/matplotlib
  HF_MODELS_ROOT: /gpt-lab/long/models/hf-serving
  DEVICE: cpu
  INFERENCE_TIMEOUT_SECONDS: "600"

x-audio-volumes: &audio-volumes
  - ./model-cache:/models
  - ./models/hf:/models/hf
  - ./models/hf-cache:/models/huggingface
  - /gpt-lab/long/models:/gpt-lab/long/models:ro
  - ${OUTPUTS_HOST_DIR:-./outputs}:/outputs

services:
  model-gateway:
    build:
      context: .
      dockerfile: model-gateway/Dockerfile
    ports:
      - "9000:9000"
    environment:
      GATEWAY_PUBLIC_BASE_URL: http://localhost:9000
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-600}
      OUTPUT_ROOT: /outputs
      # Override when Ollama runs outside compose (e.g. host systemd):
      # OLLAMA_BASE_URL=http://host.docker.internal:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      DOCUMENT_RASTERIZER_URL: http://document-rasterizer:8130
      MODEL_GATEWAY_JWT_SECRET: ${MODEL_GATEWAY_JWT_SECRET:-}
    volumes:
      - ${OUTPUTS_HOST_DIR:-./outputs}:/outputs
      # Shared with document-rasterizer -- assets.py writes here, the
      # rasterizer reads the same tenant-scoped layout back. Without this
      # bind mount each container only sees its own ephemeral writable
      # layer and the two services can never actually see each other's
      # files (real gap found and fixed 2026-08-01: this mount never
      # existed, so uploaded assets weren't durable across restarts
      # either).
      - /gpt-lab/long/computer-vision/assets:/gpt-lab/long/computer-vision/assets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
      - audio-kokoro
      - audio-melotts
      - audio-outetts
      - audio-espnet
      - audio-bark
      - audio-chatterbox
      - audio-xtts
      - audio-csm
      - audio-legacy
      - audio-parler
      - audio-dia
      - audio-cosyvoice
      - vision-ocr
      - vision-detection
      - document-rasterizer
    networks:
      - model-server

  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - model-server

  multimodal-legacy:
    profiles:
      - docker-multimodal
    build:
      context: .
      dockerfile: services/multimodal-legacy/Dockerfile
    expose:
      - "8001"
    environment:
      <<: *audio-environment
      PUBLIC_BASE_URL: http://multimodal-legacy:8001
      IMAGE_PUBLIC_BASE_URL: http://multimodal-legacy:8001
      AUDIO_PUBLIC_BASE_URL: http://multimodal-legacy:8001
    volumes: *audio-volumes
    networks:
      - model-server

  audio-kokoro:
    build:
      context: .
      dockerfile: services/audio-kokoro/Dockerfile
    expose:
      - "8102"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-kokoro:8102
    volumes: *audio-volumes
    networks:
      - model-server

  audio-melotts:
    build:
      context: .
      dockerfile: services/audio-melotts/Dockerfile
    expose:
      - "8104"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-melotts:8104
      TTS_HOME: /models/tts
    volumes: *audio-volumes
    networks:
      - model-server

  audio-outetts:
    build:
      context: .
      dockerfile: services/audio-outetts/Dockerfile
    expose:
      - "8105"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-outetts:8105
    volumes: *audio-volumes
    networks:
      - model-server

  audio-espnet:
    build:
      context: .
      dockerfile: services/audio-espnet/Dockerfile
    expose:
      - "8103"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-espnet:8103
      ESPNET_CACHE: /models/espnet
    volumes: *audio-volumes
    networks:
      - model-server

  audio-bark:
    build:
      context: .
      dockerfile: services/audio-bark/Dockerfile
    expose:
      - "8106"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-bark:8106
    volumes: *audio-volumes
    networks:
      - model-server

  audio-chatterbox:
    build:
      context: .
      dockerfile: services/audio-chatterbox/Dockerfile
    expose:
      - "8107"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-chatterbox:8107
    volumes: *audio-volumes
    networks:
      - model-server

  audio-xtts:
    build:
      context: .
      dockerfile: services/audio-xtts/Dockerfile
    expose:
      - "8109"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-xtts:8109
      TTS_HOME: /models/tts
      COQUI_TOS_AGREED: "1"
    volumes: *audio-volumes
    networks:
      - model-server

  audio-csm:
    build:
      context: .
      dockerfile: services/audio-csm/Dockerfile
    expose:
      - "8110"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-csm:8110
    volumes: *audio-volumes
    networks:
      - model-server

  audio-parler:
    build:
      context: .
      dockerfile: services/audio-parler/Dockerfile
    expose:
      - "8111"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-parler:8111
    volumes: *audio-volumes
    networks:
      - model-server

  audio-dia:
    build:
      context: .
      dockerfile: services/audio-dia/Dockerfile
    expose:
      - "8112"
    environment:
      <<: *audio-environment
      DEVICE: cuda
      AUDIO_PUBLIC_BASE_URL: http://audio-dia:8112
      DIA_MODEL_PATH: /gpt-lab/long/models/text-to-speech/dia-1-6b
    volumes: *audio-volumes
    networks:
      - model-server

  audio-cosyvoice:
    build:
      context: .
      dockerfile: services/audio-cosyvoice/Dockerfile
    expose:
      - "8113"
    environment:
      <<: *audio-environment
      DEVICE: cuda
      AUDIO_PUBLIC_BASE_URL: http://audio-cosyvoice:8113
      COSYVOICE2_MODEL_PATH: /gpt-lab/long/models/text-to-speech/cosyvoice2-0.5b
    volumes: *audio-volumes
    networks:
      - model-server

  audio-legacy:
    build:
      context: .
      dockerfile: services/audio-legacy/Dockerfile
    expose:
      - "8002"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-legacy:8002
      COSYVOICE2_MODEL_PATH: /models/text-to-speech/cosyvoice2-0.5b
      INDEXTTS2_MODEL_PATH: /models/text-to-speech/indextts-2
      STABLE_AUDIO_MODEL_PATH: /gpt-lab/long/models/text-to-audio/stable-audio-open-1.0
    volumes: *audio-volumes
    networks:
      - model-server

  vision-ocr:
    build:
      context: .
      dockerfile: services/vision-ocr/Dockerfile
    expose:
      - "8120"
    environment:
      PADDLE_PDX_CACHE_HOME: /gpt-lab/long/models/paddle
      HF_HOME: /gpt-lab/long/models/hf
      TRANSFORMERS_CACHE: /gpt-lab/long/models/hf
      NVIDIA_VISIBLE_DEVICES: GPU-47cba434-13c2-1aca-e112-f8d1c9659d5a
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /gpt-lab/long/models:/gpt-lab/long/models
      - ./config/gpu-policy.yaml:/app/config/gpu-policy.yaml:ro
      - ./scripts/check-gpu-ownership.py:/app/scripts/check-gpu-ownership.py:ro
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        python /app/scripts/check-gpu-ownership.py
        --policy /app/config/gpu-policy.yaml
        --target-service vision-ocr
        --json
        && exec uvicorn main:app --host 0.0.0.0 --port 8120
    networks:
      - model-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-47cba434-13c2-1aca-e112-f8d1c9659d5a"]
              capabilities: [gpu]

  vision-detection:
    build:
      context: .
      dockerfile: services/vision-detection/Dockerfile
    expose:
      - "8121"
    environment:
      HF_HOME: /gpt-lab/long/models/hf
      TRANSFORMERS_CACHE: /gpt-lab/long/models/hf
      VISION_DETECTION_MODEL_ID: PekingU/rtdetr_r50vd
      NVIDIA_VISIBLE_DEVICES: GPU-b8a1d704-80b3-37f8-c2ed-e764700c5326
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /gpt-lab/long/models:/gpt-lab/long/models
      - ./config/gpu-policy.yaml:/app/config/gpu-policy.yaml:ro
      - ./scripts/check-gpu-ownership.py:/app/scripts/check-gpu-ownership.py:ro
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        python /app/scripts/check-gpu-ownership.py
        --policy /app/config/gpu-policy.yaml
        --target-service vision-detection
        --json
        && exec uvicorn main:app --host 0.0.0.0 --port 8121
    networks:
      - model-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["GPU-b8a1d704-80b3-37f8-c2ed-e764700c5326"]
              capabilities: [gpu]

  vision-tesseract:
    build:
      context: .
      dockerfile: services/vision-tesseract/Dockerfile
    expose:
      - "8122"
    networks:
      - model-server

  vision-yolox:
    build:
      context: .
      dockerfile: services/vision-yolox/Dockerfile
    expose:
      - "8125"
    networks:
      - model-server

  vision-grounding-dino:
    build:
      context: .
      dockerfile: services/vision-grounding-dino/Dockerfile
    expose:
      - "8124"
    networks:
      - model-server

  vision-ocr-ensemble:
    build:
      context: .
      dockerfile: services/vision-ocr-ensemble/Dockerfile
    expose:
      - "8123"
    environment:
      VISION_OCR_PADDLE_URL: http://vision-ocr:8120/generate/ocr/paddle
      VISION_OCR_TESSERACT_URL: http://vision-tesseract:8122/generate/ocr/tesseract
    depends_on:
      - vision-ocr
      - vision-tesseract
    networks:
      - model-server

  commercial-planner:
    build:
      context: .
      dockerfile: services/commercial-planner/Dockerfile
    expose:
      - "8127"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_PLANNER_MODEL: ${OPENAI_PLANNER_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_PLANNER_MODEL: ${OPENROUTER_PLANNER_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - model-server

  document-rasterizer:
    build:
      context: .
      dockerfile: services/document-rasterizer/Dockerfile
    expose:
      - "8130"
    environment:
      GATEWAY_ASSETS_ROOT: /gpt-lab/long/computer-vision/assets
    volumes:
      - /gpt-lab/long/computer-vision/assets:/gpt-lab/long/computer-vision/assets
    networks:
      - model-server

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - "--collector.textfile.directory=/gpt-lab-metrics"
    volumes:
      - /gpt-lab/long/computer-vision/metrics:/gpt-lab-metrics:ro
    expose:
      - "9100"
    networks:
      - model-server

  prometheus:
    image: prom/prometheus:v2.55.1
    user: "1002:1002"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/computer-vision-alerts.yaml:/etc/prometheus/computer-vision-alerts.yaml:ro
      - /gpt-lab/long/computer-vision/prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager
    networks:
      - model-server

  alertmanager:
    image: prom/alertmanager:v0.27.0
    user: "1002:1002"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /gpt-lab/long/computer-vision/alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - model-server

networks:
  model-server:
    driver: bridge

volumes:
  ollama-data:
