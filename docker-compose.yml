x-audio-environment: &audio-environment
  OUTPUT_ROOT: /outputs
  HF_HOME: /models/huggingface
  HF_HUB_CACHE: /models/huggingface/hub
  TRANSFORMERS_CACHE: /models/huggingface
  TORCH_HOME: /models/torch
  XDG_CACHE_HOME: /models/cache
  MPLCONFIGDIR: /models/cache/matplotlib
  HF_MODELS_ROOT: /gpt-lab/long/models/hf-serving
  DEVICE: cpu
  INFERENCE_TIMEOUT_SECONDS: "600"

x-audio-volumes: &audio-volumes
  - ./model-cache:/models
  - ./models/hf:/models/hf
  - ./models/hf-cache:/models/huggingface
  - /gpt-lab/long/models:/gpt-lab/long/models:ro
  - ${OUTPUTS_HOST_DIR:-./outputs}:/outputs

services:
  model-gateway:
    build:
      context: .
      dockerfile: model-gateway/Dockerfile
    ports:
      - "9000:9000"
    environment:
      GATEWAY_PUBLIC_BASE_URL: http://localhost:9000
      GATEWAY_TIMEOUT_SECONDS: ${GATEWAY_TIMEOUT_SECONDS:-600}
      OUTPUT_ROOT: /outputs
      # Override when Ollama runs outside compose (e.g. host systemd):
      # OLLAMA_BASE_URL=http://host.docker.internal:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ${OUTPUTS_HOST_DIR:-./outputs}:/outputs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
      - audio-kokoro
      - audio-melotts
      - audio-outetts
      - audio-espnet
      - audio-bark
      - audio-chatterbox
      - audio-xtts
      - audio-csm
      - audio-legacy
      - audio-parler
      - audio-dia
      - audio-cosyvoice
    networks:
      - model-server

  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - model-server

  multimodal-legacy:
    profiles:
      - docker-multimodal
    build:
      context: .
      dockerfile: services/multimodal-legacy/Dockerfile
    expose:
      - "8001"
    environment:
      <<: *audio-environment
      PUBLIC_BASE_URL: http://multimodal-legacy:8001
      IMAGE_PUBLIC_BASE_URL: http://multimodal-legacy:8001
      AUDIO_PUBLIC_BASE_URL: http://multimodal-legacy:8001
    volumes: *audio-volumes
    networks:
      - model-server

  audio-kokoro:
    build:
      context: .
      dockerfile: services/audio-kokoro/Dockerfile
    expose:
      - "8102"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-kokoro:8102
    volumes: *audio-volumes
    networks:
      - model-server

  audio-melotts:
    build:
      context: .
      dockerfile: services/audio-melotts/Dockerfile
    expose:
      - "8104"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-melotts:8104
      TTS_HOME: /models/tts
    volumes: *audio-volumes
    networks:
      - model-server

  audio-outetts:
    build:
      context: .
      dockerfile: services/audio-outetts/Dockerfile
    expose:
      - "8105"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-outetts:8105
    volumes: *audio-volumes
    networks:
      - model-server

  audio-espnet:
    build:
      context: .
      dockerfile: services/audio-espnet/Dockerfile
    expose:
      - "8103"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-espnet:8103
      ESPNET_CACHE: /models/espnet
    volumes: *audio-volumes
    networks:
      - model-server

  audio-bark:
    build:
      context: .
      dockerfile: services/audio-bark/Dockerfile
    expose:
      - "8106"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-bark:8106
    volumes: *audio-volumes
    networks:
      - model-server

  audio-chatterbox:
    build:
      context: .
      dockerfile: services/audio-chatterbox/Dockerfile
    expose:
      - "8107"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-chatterbox:8107
    volumes: *audio-volumes
    networks:
      - model-server

  audio-xtts:
    build:
      context: .
      dockerfile: services/audio-xtts/Dockerfile
    expose:
      - "8109"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-xtts:8109
      TTS_HOME: /models/tts
      COQUI_TOS_AGREED: "1"
    volumes: *audio-volumes
    networks:
      - model-server

  audio-csm:
    build:
      context: .
      dockerfile: services/audio-csm/Dockerfile
    expose:
      - "8110"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-csm:8110
    volumes: *audio-volumes
    networks:
      - model-server

  audio-parler:
    build:
      context: .
      dockerfile: services/audio-parler/Dockerfile
    expose:
      - "8111"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-parler:8111
    volumes: *audio-volumes
    networks:
      - model-server

  audio-dia:
    build:
      context: .
      dockerfile: services/audio-dia/Dockerfile
    expose:
      - "8112"
    environment:
      <<: *audio-environment
      DEVICE: cuda
      AUDIO_PUBLIC_BASE_URL: http://audio-dia:8112
      DIA_MODEL_PATH: /gpt-lab/long/models/text-to-speech/dia-1-6b
    volumes: *audio-volumes
    networks:
      - model-server

  audio-cosyvoice:
    build:
      context: .
      dockerfile: services/audio-cosyvoice/Dockerfile
    expose:
      - "8113"
    environment:
      <<: *audio-environment
      DEVICE: cuda
      AUDIO_PUBLIC_BASE_URL: http://audio-cosyvoice:8113
      COSYVOICE2_MODEL_PATH: /gpt-lab/long/models/text-to-speech/cosyvoice2-0.5b
    volumes: *audio-volumes
    networks:
      - model-server

  audio-legacy:
    build:
      context: .
      dockerfile: services/audio-legacy/Dockerfile
    expose:
      - "8002"
    environment:
      <<: *audio-environment
      AUDIO_PUBLIC_BASE_URL: http://audio-legacy:8002
      COSYVOICE2_MODEL_PATH: /models/text-to-speech/cosyvoice2-0.5b
      INDEXTTS2_MODEL_PATH: /models/text-to-speech/indextts-2
      STABLE_AUDIO_MODEL_PATH: /gpt-lab/long/models/text-to-audio/stable-audio-open-1.0
    volumes: *audio-volumes
    networks:
      - model-server

networks:
  model-server:
    driver: bridge

volumes:
  ollama-data:
