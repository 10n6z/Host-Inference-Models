# Model routing registry. Update endpoint when moving models between family services.
# Rollback: point endpoint back to audio-legacy legacy_path.

services:
  multimodal-legacy:
    name: multimodal-legacy
    family: image-video-legacy
    base_url: http://host.docker.internal:8001
  audio-legacy:
    name: audio-legacy
    family: audio-legacy
    base_url: http://audio-legacy:8002
  audio-kokoro:
    name: audio-kokoro
    family: audio-kokoro
    base_url: http://audio-kokoro:8102
  audio-melotts:
    name: audio-melotts
    family: audio-melotts
    base_url: http://audio-melotts:8104
  audio-outetts:
    name: audio-outetts
    family: audio-outetts
    base_url: http://audio-outetts:8105
  audio-espnet:
    name: audio-espnet
    family: audio-espnet
    base_url: http://audio-espnet:8103
  audio-bark:
    name: audio-bark
    family: audio-bark
    base_url: http://audio-bark:8106
  audio-chatterbox:
    name: audio-chatterbox
    family: audio-chatterbox
    base_url: http://audio-chatterbox:8107
  audio-xtts:
    name: audio-xtts
    family: audio-xtts
    base_url: http://audio-xtts:8109
  audio-csm:
    name: audio-csm
    family: audio-csm
    base_url: http://audio-csm:8110
  audio-parler:
    name: audio-parler
    family: audio-parler
    base_url: http://audio-parler:8111
  audio-dia:
    name: audio-dia
    family: audio-dia
    base_url: http://audio-dia:8112
  audio-cosyvoice:
    name: audio-cosyvoice
    family: audio-cosyvoice
    base_url: http://audio-cosyvoice:8113
  ollama:
    name: ollama
    family: text-generation
    base_url: http://ollama:11434
  flux2:
    name: flux2
    family: image-flux2
    base_url: http://host.docker.internal:8011
  framepack:
    name: framepack
    family: video-framepack
    base_url: http://host.docker.internal:8012
  magi:
    name: magi
    family: video-magi
    base_url: http://host.docker.internal:8016
models:
  "deepseek-coder:6.7b":
    display_name: "deepseek-coder:6.7b"
    task: text-generation
    modality: text
    provider: ollama
    runtime_model: "deepseek-coder:6.7b"
    service: ollama
    family: text-generation
    endpoint: http://ollama:11434/api/generate
    mode: sync
    fields:
      prompt: { type: string, required: false, max_length: 12000 }
      messages: { type: array, required: false }
      system_instruction: { type: string, required: false, max_length: 8000 }
      temperature: { type: number, default: 0.7, min: 0.0, max: 2.0 }
      max_tokens: { type: integer, default: 512, min: 1, max: 8192 }

