  language: fi
  expected_text: Cthulhu on kirjailija H. P. Lovecraftin luoma kuvitteellinen jumalaolento
    ja Cthulhu-taruston tunnetuin hahmo. Sen ensiesiintyminen oli Lovecraftin vuonna
    1926 kirjoittamassa novellissa ”Cthulhun kutsu”. Sen mukaan Cthulhu on suurten
    muinaisten ylipappi, joka nukkuu kuolemankaltaista unta mereen vajonneessa R’lyehin
    kaupungissa. Kun tähdet ovat oikein, Cthulhu palaa maan päälle ja sen palvojat
    hekumoivat ja irstailevat maan päällä vapaasti. Cthulhu kuvataan usein jättiläiseksi,
    jolla on suuret lepakkomaiset siivet sekä mustekalaa muistuttava pää. Jo hirviön
    ulkomuodon kerrotaan olevan niin kauhistuttava, että se ajaa heikkotahtoiset hulluuteen.
    Myöhemmässä kauhukirjallisuudessa Cthulhusta
