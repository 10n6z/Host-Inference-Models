  expected_text: Derary on maalaiskunta Moptin alueen Djennén piirissä Malissa. Sen
    keskuskylä Gagna sijaitsee Nigerjoen tulva-alueella 15 kilometriä Djennéstä pohjoiseen.
    Kunnassa on 6 600 asukasta (vuonna 2009). Deraryn kunta rajoittuu idässä Djennén
    piirin Femayen, etelässä Djennén, lännessä Ouro Alin ja pohjoisessa Kéwan sekä
    koillisessa Moptin piirin Soyen kuntiin. Seutu kuuluu Sahelin vyöhykkeeseen. Kunnan
    alueella virtaa Nigerin ja Banin haarajokia. Kuntaan kuuluu kahdeksan kylää. Asukkaat
    ovat bambaroita, fulbeja ja bozoja. Paikallisia elinkeinoja ovat maanviljely,
    karjanhoito, kalastus, käsityöammatit ja pienimuotoinen kaupankäynti. Tärkeimmät
    viljelykasvit ovat riisi, hirssi, durra ja maissi.
