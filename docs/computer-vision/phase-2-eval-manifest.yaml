  expected_text: 'Amphicar on vuosina 1961–1968 valmistettu saksalainen automerkki.
    Nimensä mukaisesti yritys valmisti amfibista autoa, joka oli ajettavissa niin
    maalla kuin vedessä. Amphicar-ratin keskiössä oleva merkki viittaa ensi valmistuspaikkakunnan,
    Lübeckin kuuluisaan Holstentor-maamerkkiin, erääseen kaupunginmuurien porteista.
    Mallin kehittäneellä, monipuolisella ja kekseliäällä, mutta kiistellyllä Hans
    Trippelillä oli usean vuosikymmenen kokemus ajoneuvotyypistä: amfibista, sotilaalliseen
    käyttöön luotua, nelivetoista SG 6-mallia valmistui vuosina 1938-1944 tuhannen
    kappaletta Wehrmachtin käyttöön. Trippelin myöhemmät 1950-luvun kääpiöautomallit
    herättivät aluksi suurta kiinnostusta, mutta nopeasti'
