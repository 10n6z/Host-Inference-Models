    yhä yleisessä käytössä. Käsitettä on toisaalta kritisoitu liian epämääräiseksi
    ja yleistäväksi. Päällikkökunnassa päälliköllä on erityinen rituaalinen tai poliittinen
    asema, joka monesti periytyy. Yhteiskunnallinen asema päällikkökunnassa määräytyy
    sen mukaan miten läheinen sukulainen päällikölle on. Päällikkökunta on heimoa
    mutkikkaampi, mutta valtiota yksinkertaisempi. Monesti päällikkökunnassa on ylipäällikkö,
