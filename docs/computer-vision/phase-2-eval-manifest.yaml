    mykkäelokuva. Sen aiheena on Yhdysvaltain sisällissota ja sitä seurannut Etelävaltioiden
    uudelleenrakennus ja toipuminen. Kansakunnan synty lisäsi paljon elokuvan arvostusta
    viestintävälineenä. Se synnytti myös suuria ristiriitoja, ja siihen liittyi ennennäkemättömän
    kiihkeitä mielenosoituksia ja sensuurikahakoita. Elokuva kestää peräti kolme tuntia,
    vaikka tuohon aikaan kokoillan elokuvien tyypillinen kesto oli tunnin paikkeilla.
    Se on ollut myös kritiikin kohteena valkoisten ylivaltaa korostavan ja Ku Klux
    Klania ihannoivan rasistisen
