  expected_text: Backwood Madness on Ari Savosen ohjaama suomalainen kauhufantasiaelokuva,
    joka sai ensi-iltansa elokuussa 2025. Elokuvassa ihmisten sodat aiheuttavat metsän
    epätasapainon, joka johtaa metsän olennoiden ja ihmisten väliseen jatkuvaan raakaan
    kostonkierteeseen. Metsän tasapainon voi mahdollisesti palauttaa kostoretkien
    aikana syntynyt lapsi, joka on puoliksi peikko ja puoliksi ihminen. Elokuva oli
    tuotannossa yli kymmenen vuoden ajan, vuodesta 2014 lähtien. Ensimmäisen kerran
    sen oli tarkoitus ilmestyä vuonna 2016, mutta ensi-iltaa siirrettiin useamman
    kerran. Elokuvan tekemistä vaikeuttivat muun muassa aikataulullisesti venyneet
    lisäkuvaukset, koronapandemia sekä Savosen terveysongelmat.
