auth_deviation: >-
  Predictions were generated by calling the vision-ocr, vision-detection,
  vision-yolox, and vision-grounding-dino containers directly on the
  host-inference-models_model-server docker network, NOT through
  model-gateway's authenticated /generate endpoint. Decision recorded
  2026-08-01: the harness could not safely obtain MODEL_GATEWAY_JWT_SECRET
  (the safety classifier correctly blocked reading it out of the running
  container's environment), so calling the internal services directly was
  chosen over further credential-hunting. This exercises real model
  quality and latency but does NOT exercise the gateway's auth layer as
  the plan's "calls the authenticated gateway endpoints" text originally
  specified -- see scripts/run_predictions_via_direct_containers.py's
  docstring (copied to
  /gpt-lab/long/computer-vision/phase-2-eval/_downloads/run_predictions.py
  on the host) for the exact call sites.

