known_failing_metrics_disposition: >-
  Decision recorded 2026-08-01, per explicit user instruction: publish the
  real measured numbers as-is and keep the pre-existing QUALITY_FLOORS
  values unchanged (they were never validated against real data before
  this run). Failing metrics are follow-up work, not adjusted to make this
  baseline "pass." Root-cause notes below are diagnostic, not excuses to
  silently raise the numbers.

root_cause_notes:
  ocr_en: >-
    Spot-checked prediction vs. expected text for ocr_en-82092117: content
    is substantively correct ("Attorney General Betty D. Montgomery",
    "CONFIDENTIAL FACSIMILE TRANSMISSION COVER SHEET" both verbatim
    matches). Most of the measured CER/WER is spacing/tokenization noise
    from reconstructing FUNSD's per-word bounding-box annotations into a
    single ground-truth string (build_ocr_en.py's reading_order_text),
    which does not always match PaddleOCR's own word segmentation (e.g.
    ground truth "P. 01" vs prediction "P.01"). This floor comparison
    measures reconstruction methodology as much as true OCR accuracy --
    flagged as a real methodology gap, not fixed in this session per the
    "stop here" scope decision.
  grounding_dino_recall50: >-
    Spot-checked detection_open_vocab-70774 (6 ground-truth "birdcage"
    instances): grounding-dino-tiny at confidence_threshold=0.4 detected 1
    of 6 with a high-quality IoU match on the one it found. This pattern
    repeats across the open-vocab set -- individual detections are
    accurate (correct label, tight IoU) but the model does not surface
    every instance of a repeated small object in a cluttered scene. This
    is a genuine capability gap of the tiny variant at this threshold, not
    a label-formatting bug (LVIS's underscore_joined category names were
    normalized to natural-language phrases in both the query and the
    scoring comparison; recall moved from 0.124 to 0.157 after that fix,
    confirming formatting was a minor contributor, not the primary cause).

